plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id "net.ltgt.errorprone" version "5.2.0"
}

group = 'io.temporal.demo'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

ext {
    javaSDKVersion = '1.30.1'
    lombokVersion = '1.18.48'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot's versions; without this the starters resolve to the Spring Boot 2.7 that
    // temporal-spring-boot-starter depends on, whose Spring 5 can't read Java 25 class files.
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "io.temporal:temporal-spring-boot-starter:$javaSDKVersion"
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'jakarta.annotation:jakarta.annotation-api'
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "io.temporal:temporal-testing:$javaSDKVersion"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    errorprone('com.google.errorprone:error_prone_core:2.52.0')
}

bootJar {
    mainClass = 'io.temporal.demo.wealthmanagement.StartTheWorker'
    enabled = true
}

bootRun {
    mainClass = 'io.temporal.demo.wealthmanagement.StartTheWorker'
    enabled = true
}

jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('runWorker', JavaExec) {
    dependsOn 'classes'
    mainClass = 'io.temporal.demo.wealthmanagement.StartTheWorker'
    classpath = sourceSets.main.runtimeClasspath
}
